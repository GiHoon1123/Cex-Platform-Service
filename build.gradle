// Boot 플러그인 자체의 JSON 의존성도 보안 공지의 수정 버전으로 맞춘다.
// 애플리케이션 BOM만 바꾸면 빌드 프로세스의 취약 버전은 남으므로 범위를 구분한다.
buildscript {
    configurations.classpath {
        resolutionStrategy.activateDependencyLocking()
        resolutionStrategy.force 'tools.jackson.core:jackson-core:3.1.8',
                'tools.jackson.core:jackson-databind:3.1.8',
                'org.apache.commons:commons-lang3:3.21.0'
    }
}

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'me.champeau.jmh' version '0.7.3'
}

// 플러그인 버전과 같은 BOM을 자동 적용한다. 서로 다른 Spring 버전을 중복 고정하지 않는다.

// 2026-10-22 보안 공지 대조 결과 기본 BOM보다 후속 패치가 필요하다.
// 동일 계열의 패치만 선택하고 아래 버전·잠금·전체 회귀 결과를 함께 관리한다.
ext['jackson-bom.version'] = '3.1.8'
ext['jackson-2-bom.version'] = '2.21.8'
ext['tomcat.version'] = '11.0.27'
// H2 2.4.240의 연결 간 CHECK 제약 회귀를 수정한 공식 릴리스를 사용한다.
ext['h2.version'] = '2.5.252'
dependencyManagement {
    dependencies {
        dependency 'at.yawk.lz4:lz4-java:1.11.4'
    }
}

group = 'dustin'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// 경로별 기본 거부와 역할 검증은 표준 보안 필터 체인에 맡긴다.
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// 보안키의 서명·출처·사용자 확인 검증은 유지보수되는 표준 구현에 맡긴다.
	implementation 'org.springframework.security:spring-security-webauthn'
	// 동일 플랫폼 포트에서 공개 시세 스트림을 제공한다.
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// 메일 프로토콜·MIME·TLS는 Spring 표준 메일 구현에 맡긴다.
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.postgresql:postgresql'
	// 신규 환경의 JPA 기본 표는 버전이 고정된 이력으로 먼저 만들고 Hibernate는 검증만 수행한다.
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	// Swagger가 이미 요구하는 Jackson 2를 JWT 내부에서도 사용해 세 번째 JSON 라이브러리를 추가하지 않는다.
	// 애플리케이션의 HTTP·금융 JSON은 Jackson 3이며 이전 매퍼로 우회하지 않는다.
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
	implementation 'de.mkammerer:argon2-jvm:2.12'
	
	// Spring Boot 4.1의 Jackson 3·MVC 구성에 맞는 공식 문서화 모듈을 사용한다.
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	
	// 정산 재시도는 Spring Framework 7에 포함된 기능을 사용한다.
	
	// Kafka
	implementation 'org.springframework.boot:spring-boot-starter-kafka'
	
	// WebSocket Client (바이낸스 WebSocket 연결용)
	implementation 'org.java-websocket:Java-WebSocket:1.6.0'
	
	// JSON 처리 (Jackson은 이미 Spring Boot에 포함됨)
	
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
	testImplementation 'com.h2database:h2'
	testImplementation 'org.awaitility:awaitility:4.2.0'
	// 테스트 서버는 수신 내용을 메모리에만 보관하며 외부 수신자에게 전달하지 않는다.
	testImplementation('com.icegreen:greenmail:2.1.14') {
		// 제품의 API·구현 모듈을 그대로 사용하고 테스트의 번들형 중복 클래스는 제외한다.
		exclude group: 'org.eclipse.angus', module: 'jakarta.mail'
	}
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	
	// JMH for benchmarking
	jmh 'org.openjdk.jmh:jmh-core:1.37'
	jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}

tasks.named('test') {
	useJUnitPlatform()
	// 제품 PostgreSQL 마이그레이션은 별도 실제 DB 회귀가 소유한다. 단위·통합 시험의 임시 스키마와 섞지 않는다.
	systemProperty 'spring.flyway.enabled', 'false'
}

// JMH 벤치마크에 GC 로그 및 JVM 옵션 추가
jmh {
	def gcArg = System.getProperty('gcArg', '-XX:+UseG1GC')
	def extraJvmArgs = System.getProperty('extraJvmArgs')
	def extraList = extraJvmArgs?.split(',')?.collect { it.trim() }?.findAll { it }
	def enableNonHeapLimit = System.getProperty('enableNonHeapLimit', 'true') == 'true'

	// 웜업/측정: -Pjmh.warmupIterations=5 -Pjmh.warmup=3s -Pjmh.iterations=5 -Pjmh.timeOnIteration=3s 로 오버라이드 가능
	warmupIterations = (findProperty('jmh.warmupIterations') ?: 3) as int
	warmup = findProperty('jmh.warmup') ?: '2s'
	iterations = (findProperty('jmh.iterations') ?: 3) as int
	timeOnIteration = findProperty('jmh.timeOnIteration') ?: '2s'

	def baseArgs = [
		// Heap 메모리 설정
		'-Xmx2G',
		'-Xms2G',
		
		// GC 설정
		gcArg
	]

	// Non-Heap 메모리 제한 (선택적)
	if (enableNonHeapLimit) {
		baseArgs.addAll([
			'-XX:MaxMetaspaceSize=256m',        // Metaspace 제한 (클래스 메타데이터)
			'-XX:ReservedCodeCacheSize=128m',   // Code Cache 제한 (JIT 컴파일 코드)
			'-XX:MaxDirectMemorySize=64m',      // Direct Memory 제한 (네이티브 메모리)
			'-Xss512k'                          // Thread Stack 크기 (스레드당)
		])
	}

	// GC 로그 및 디버깅
	baseArgs.addAll([
		'-Xlog:gc*:file=build/results/jmh/gc.log:time,uptime,level,tags',
		'-XX:+HeapDumpOnOutOfMemoryError',
		'-XX:HeapDumpPath=build/results/jmh/'
	])

	if (extraList) {
		baseArgs.addAll(extraList)
	}

	jvmArgs = baseArgs
}

// 검증한 전이 의존성도 고정해 다음 빌드가 다른 라이브러리를 고르지 않게 한다.
dependencyLocking { lockAllConfigurations() }

// 실행·테스트·벤치·빌드의 실제 버전과 파일 해시를 보안 점검 증적으로 내보낸다.
tasks.register('writeDependencyInventory') {
    def destination = layout.buildDirectory.file('reports/dependencies/inventory.json')
    outputs.file(destination)
    outputs.upToDateWhen { false }
    doLast {
        def entries = []
        def sources = [runtime: configurations.runtimeClasspath,
                       test: configurations.testRuntimeClasspath,
                       benchmark: configurations.jmhRuntimeClasspath,
                       build: buildscript.configurations.classpath]
        sources.each { scope, configuration ->
            configuration.resolvedConfiguration.resolvedArtifacts.each { artifact ->
                def id = artifact.moduleVersion.id
                def digest = java.security.MessageDigest.getInstance('SHA-256')
                artifact.file.withInputStream { stream ->
                    byte[] buffer = new byte[65536]
                    int count
                    while ((count = stream.read(buffer)) != -1) digest.update(buffer, 0, count)
                }
                entries.add([scope: scope, group: id.group, name: id.name, version: id.version,
                             file: artifact.file.name, sha256: digest.digest().encodeHex().toString()])
            }
        }
        def output = destination.get().asFile
        output.parentFile.mkdirs()
        output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(entries.sort { a,b ->
            (a.scope + ':' + a.group + ':' + a.name) <=> (b.scope + ':' + b.group + ':' + b.name)
        }))
    }
}

// 운영자 초기화는 웹 앱과 별도 진입점의 실행 파일로 배포한다. 일반 서버에서는 자동 실행되지 않는다.
tasks.register('operatorAdminJar', org.springframework.boot.gradle.tasks.bundling.BootJar) {
    archiveClassifier = 'operator-admin'
    targetJavaVersion = JavaVersion.VERSION_21
    mainClass = 'dustin.operator.OperatorAdminApplication'
    classpath = sourceSets.main.runtimeClasspath
}

// 개인키 RPC 자격은 웹 플랫폼과 분리한 이 실행 파일에만 제공한다. 방송 권한은 다음 별도 경계에서 다룬다.
tasks.register('bitcoinSignerJar', org.springframework.boot.gradle.tasks.bundling.BootJar) {
    archiveClassifier = 'bitcoin-signer'
    targetJavaVersion = JavaVersion.VERSION_21
    mainClass = 'dustin.signer.BitcoinSignerApplication'
    classpath = sourceSets.main.runtimeClasspath
}

// 서명 결과를 공개망에 내보내는 권한은 개인키 서명 프로세스와 분리한 실행 파일에만 제공한다.
tasks.register('bitcoinBroadcasterJar', org.springframework.boot.gradle.tasks.bundling.BootJar) {
    archiveClassifier = 'bitcoin-broadcaster'
    targetJavaVersion = JavaVersion.VERSION_21
    mainClass = 'dustin.broadcaster.BitcoinBroadcasterApplication'
    classpath = sourceSets.main.runtimeClasspath
}

// 공개 노드의 체인 사실 확인은 방송·서명 권한과 분리한 읽기 전용 실행 파일에서 수행한다.
tasks.register('bitcoinConfirmerJar', org.springframework.boot.gradle.tasks.bundling.BootJar) {
    archiveClassifier = 'bitcoin-confirmer'
    targetJavaVersion = JavaVersion.VERSION_21
    mainClass = 'dustin.confirmer.BitcoinConfirmerApplication'
    classpath = sourceSets.main.runtimeClasspath
}

// 이더리움 서명 RPC 권한은 고객·운영자 HTTP가 없는 별도 실행 파일에만 제공한다.
tasks.register('ethereumSignerJar', org.springframework.boot.gradle.tasks.bundling.BootJar) {
    archiveClassifier = 'ethereum-signer'
    targetJavaVersion = JavaVersion.VERSION_21
    mainClass = 'dustin.ethsigner.EthereumSignerApplication'
    classpath = sourceSets.main.runtimeClasspath
}

// 이더리움 체인 확인 프로세스에는 개인키 RPC나 고객 HTTP 진입점을 포함하지 않는다.
tasks.register('ethereumConfirmerJar', org.springframework.boot.gradle.tasks.bundling.BootJar) {
    archiveClassifier = 'ethereum-confirmer'
    targetJavaVersion = JavaVersion.VERSION_21
    mainClass = 'dustin.ethconfirmer.EthereumConfirmerApplication'
    classpath = sourceSets.main.runtimeClasspath
}
