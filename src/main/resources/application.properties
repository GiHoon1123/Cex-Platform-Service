spring.application.name=cex

# 데이터베이스 접속 정보는 배포 환경이나 비밀 저장소에서 전부 주입한다.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# 운영 애플리케이션은 스키마를 임의로 변경하지 않고 배포된 구조만 검증한다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# 사용자 세션 서명 키는 필수 비밀값이다.
jwt.secret=${JWT_SECRET}

# Server Configuration
server.port=8080
# 신규 요청을 먼저 닫고 진행 중 요청이 끝날 시간을 준다. 강제 종료 뒤 금융 작업은 영속 큐에서 재개한다.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# SpringDoc OpenAPI (Swagger) Configuration
springdoc.api-docs.path=/api-docs/openapi.json
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# Performance Optimization (대량 정산 작업 최적화)
# Connection Pool 설정 (대량 DB 작업 최적화)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA 배치 처리 최적화
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# JSON 직렬화 최적화
# Jackson 3의 시간 타입 기본값은 ISO 문자열이다. 삭제된 이전 설정은 두지 않는다.
spring.jackson.default-property-inclusion=non_null

# 카프카 주소에는 개발용 폴백을 두지 않는다.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=cex-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# 엔진은 내부 주소로만 연결하며 배포 환경이 명시한다.
engine.http.url=${ENGINE_HTTP_URL}
engine.http.timeout=5000

# Virtual Threads Configuration (Java 21+)
# 가상 스레드 자동 설정 활성화 (Spring Boot 3.2+)
spring.threads.virtual.enabled=true

# 요청 필터에서 읽은 사용자가 업무 트랜잭션에 오래 남아 권한 회수를 가리지 않게 한다.
spring.jpa.open-in-view=false

engine.service.token=${ENGINE_SERVICE_TOKEN}

# 보안키는 출처와 RP에 묶인다. 운영에서는 어드민 HTTPS 주소와 실제 도메인을 명시한다.
# 로컬 기본값은 개발 브라우저 전용이며 인증이 끝나지 않은 운영 계정에 업무 권한을 주지 않는다.
operator.webauthn.rp-id=${OPERATOR_WEBAUTHN_RP_ID}
operator.webauthn.origin=${OPERATOR_WEBAUTHN_ORIGIN}

# 모두 미설정이면 KYC API는 503이며 미확인 고객의 신규 주문은 거부한다. 일부 설정만 있으면 시작부터 실패한다.
# 비밀은 환경/비밀 저장소로만 주입한다. workflow 버전은 검토한 실제 ID·생체·얼굴 대조 구성으로 고정한다.
didit.api-key=${DIDIT_API_KEY:}
didit.webhook-secret=${DIDIT_WEBHOOK_SECRET:}
didit.application-id=${DIDIT_APPLICATION_ID:}
didit.workflow-id=${DIDIT_WORKFLOW_ID:}
didit.workflow-version=${DIDIT_WORKFLOW_VERSION:0}
didit.environment=${DIDIT_ENVIRONMENT:}
didit.callback=${DIDIT_CALLBACK:}
didit.encryption-key=${DIDIT_ENCRYPTION_KEY:}

# 공급사 설정이 갖춰졌을 때만 전용 워커를 시작한다. 비활성화해도 오래된 확인으로 주문을 허용하지 않는다.
kyc.reconciliation.enabled=${KYC_RECONCILIATION_ENABLED:true}

# 고객 신고 원문과 대조 지문은 각각 독립 키로 보호한다. 미설정이면 신규 주문을 허용하지 않는다.
cdd.encryption-key=${CDD_ENCRYPTION_KEY:}
cdd.fingerprint-key=${CDD_FINGERPRINT_KEY:}

# 고정 서명 요청 봉투 전용 키다. 고객확인·외부 KYC·비트코인 개인키와 공유하지 않는다.
bitcoin.signer.envelope-encryption-key=${BITCOIN_SIGNER_ENVELOPE_ENCRYPTION_KEY:}
bitcoin.signer.envelope-fingerprint-key=${BITCOIN_SIGNER_ENVELOPE_FINGERPRINT_KEY:}

# 증빙 원본·열람본 전용 키다. 없으면 증빙 요청·제출·열람을 거부한다.
edd.evidence-key=${EDD_EVIDENCE_KEY:}
audit.evidence-key=${AUDIT_EVIDENCE_KEY:}

# 이더리움 입금 관찰은 명시적으로 설정하고 켠 경우에만 실행한다. 주소는 외부 키 관리 계층에서 미리 만든 공개 주소다.
ethereum.rpc-url=${ETHEREUM_RPC_URL:}
ethereum.chain-id=${ETHEREUM_CHAIN_ID:1}
ethereum.start-block=${ETHEREUM_START_BLOCK:0}
ethereum.confirmations=${ETHEREUM_CONFIRMATIONS:12}
ethereum.deposit-addresses=${ETHEREUM_DEPOSIT_ADDRESSES:}
ethereum.processing.enabled=${ETHEREUM_PROCESSING_ENABLED:false}
